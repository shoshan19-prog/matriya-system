<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MATRIYA · Control Tower</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#121826; --panel2:#0e1420; --line:#1f2937;
    --txt:#e5e9f0; --dim:#8a97ad; --accent:#5b8cff;
    --ready:#27c281; --partial:#f5b942; --poc:#34d399; --design:#5b8cff; --unknown:#9ca3af;
    --warn:#f5b942; --miss:#ef5b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,Arial}
  a{color:var(--accent)}
  header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:13px}
  .rollup{margin-inline-start:auto;display:flex;gap:14px;font-size:13px;color:var(--dim)}
  .rollup b{color:var(--txt)}
  main{padding:24px 28px;max-width:1200px;margin:0 auto}
  section{margin-bottom:32px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:0 0 14px;font-weight:600}
  .grid{display:grid;gap:14px}
  .caps{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--line))}
  .card h3{margin:0 0 2px;font-size:15px}
  .card .he{color:var(--dim);font-size:12px;margin-bottom:10px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:999px;color:#0b0f17}
  .summary{color:var(--dim);font-size:12.5px;margin:10px 0}
  .layers{display:flex;gap:6px;margin-top:8px}
  .chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 7px;border:1px solid var(--line);color:var(--dim);background:var(--panel2)}
  .chip.on{color:#0b0f17}
  .open{margin:10px 0 0;padding:0;list-style:none;font-size:11.5px;color:var(--partial)}
  .open li{padding-inline-start:14px;position:relative;margin-top:4px}
  .open li::before{content:"▸";position:absolute;inset-inline-start:0;color:var(--partial)}
  .row{display:grid;gap:10px}
  .conns{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .conn,.health,.repo,.kg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .conn .name,.health .name,.repo .name{font-weight:600}
  .conn .notes,.health .notes,.repo .role{color:var(--dim);font-size:12px;margin-top:4px}
  .kgs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .kg{text-align:center}
  .kg .val{font-size:26px;font-weight:700}
  .kg .val.pending{color:var(--dim);font-weight:500}
  .kg .lbl{color:var(--dim);font-size:12px;margin-top:2px}
  .kg .src{color:#5b6577;font-size:10px;margin-top:6px}
  .ledger{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .ledger .lh{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px}
  .seedtag{background:#2a2410;color:var(--partial);border-radius:5px;padding:1px 6px;font-size:10px;letter-spacing:0;text-transform:none}
  .mv{display:grid;grid-template-columns:38px 150px 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:12px;border-top:1px solid #161d2b}
  .mv:first-of-type{border-top:none}
  .mv .d{font-weight:700;text-align:center;border-radius:5px;padding:1px 0}
  .mv .d.p{color:var(--ready);background:#10241a}
  .mv .d.n{color:var(--miss);background:#251313}
  .mv .ty{color:var(--accent)}
  .mv .su{color:var(--txt)}
  .mv .me{color:var(--dim);font-size:11px}
  .health{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .repos{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .repo .mat{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .note{color:#5b6577;font-size:11.5px;margin-top:8px}
  /* Diagnosis (doctor layer) */
  .dx{background:linear-gradient(180deg,#141b2b,#0e1420);border:1px solid #243049;border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .dx .head{font-size:14px;color:var(--txt);margin-bottom:4px}
  .dx .head b{color:#ff8a8a}
  .dx .top{color:var(--partial);font-size:12.5px;margin-bottom:14px}
  .dx .top b{color:var(--txt)}
  .finding{border-top:1px solid var(--line);padding:12px 0}
  .finding:first-of-type{border-top:none}
  .finding .ttl{font-weight:600;display:flex;align-items:center;gap:8px}
  .chain{font-size:12.5px;color:var(--txt);margin:6px 0 2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  .chain .seg{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .chain .arr{color:var(--dim)}
  .chain .seg.root{border-color:#7a3b3b;color:#ff9b9b}
  .because{font-size:12px;color:var(--dim);margin:2px 0 0 2px}
  .because b{color:var(--accent)}
  .signals{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:8px}
  .sig{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:12px}
  .sig .sn{font-weight:600}
  .sig .sf{color:var(--accent);margin-top:4px}
  .err{color:var(--miss);padding:40px;text-align:center}
  footer{padding:18px 28px;color:#5b6577;font-size:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>MATRIYA · Control Tower</h1>
  <span class="sub" id="sub"></span>
  <div class="rollup" id="rollup"></div>
</header>
<main id="app"><p class="err" id="boot">Loading registry…</p></main>
<footer id="foot"></footer>

<script>
const S = {
  ready:{c:'var(--ready)',w:'READY'}, partial:{c:'var(--partial)',w:'PARTIAL'},
  poc:{c:'var(--poc)',w:'POC'}, design:{c:'var(--design)',w:'DESIGN'}, unknown:{c:'var(--unknown)',w:'UNKNOWN'}
};
const CONN = {ready:'var(--ready)', partial:'var(--partial)', missing:'var(--miss)'};
const HEALTH = {ok:'var(--ready)', warning:'var(--warn)', missing:'var(--miss)'};
const LAYER = {yes:'on', partial:'on', no:'', na:''};
const esc = s => String(s ?? '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function layerChip(key, v){
  const cls = LAYER[v] || '';
  const col = v==='yes' ? 'var(--ready)' : v==='partial' ? 'var(--partial)' : '';
  const style = cls ? `style="background:${col};border-color:${col}"` : '';
  return `<span class="chip ${cls}" ${style}>${key}</span>`;
}

function render(d){
  document.getElementById('sub').textContent =
    `${d.meta.platform} · as of ${d.meta.asOf} · control plane: ${d.meta.controlPlaneRepo}`;

  // roll-up
  const counts = d.capabilities.reduce((a,c)=>(a[c.status]=(a[c.status]||0)+1,a),{});
  document.getElementById('rollup').innerHTML = Object.entries(counts)
    .map(([s,n])=>`<span><b style="color:${S[s].c}">${n}</b> ${S[s].w}</span>`).join('');

  let h = '';

  // Capabilities
  h += `<section id="caps-sec"><h2>Capabilities</h2><div class="grid caps">`;
  for(const c of d.capabilities){
    const st = S[c.status] || S.unknown;
    h += `<div class="card" style="--c:${st.c}">
      <h3>${esc(c.name)}</h3><div class="he">${esc(c.hebrew)}</div>
      <span class="badge" style="background:${st.c}">${st.w}</span>
      <p class="summary">${esc(c.summary)}</p>
      <div class="layers">
        ${layerChip('B',c.layers.backend)}${layerChip('F',c.layers.frontend)}
        ${layerChip('API',c.layers.api)}${layerChip('DB',c.layers.db)}
      </div>
      ${c.openItems?.length?`<ul class="open">${c.openItems.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
    </div>`;
  }
  h += `</div></section>`;

  // Connections
  h += `<section><h2>Connections</h2><div class="row conns">`;
  for(const c of d.connections){
    h += `<div class="conn">
      <div class="name"><span class="dot" style="background:${CONN[c.status]||'var(--line)'}"></span> ${esc(c.name)}</div>
      <div class="notes">${esc(c.notes||'')}</div>
    </div>`;
  }
  h += `</div></section>`;

  // Knowledge Growth — values injected live from the ledger (window.__KG)
  if(d.knowledgeGrowth){
    const live = window.__KG || null;
    h += `<section><h2>Knowledge Growth</h2><div class="row kgs">`;
    for(const m of d.knowledgeGrowth.metrics){
      const v = live && live.balance && (m.id in live.balance) ? live.balance[m.id] : null;
      const val = v!=null ? esc(v) : '—';
      h += `<div class="kg">
        <div class="val ${v!=null?'':'pending'}">${val}</div>
        <div class="lbl">${esc(m.label)}</div>
        <div class="src">${esc(m.source)}</div>
      </div>`;
    }
    h += `</div>`;
    if(live && live.timeline && live.timeline.length){
      h += `<div class="ledger"><div class="lh">Ledger · recent movements${live.meta&&live.meta.seeded?' <span class="seedtag">seeded sample</span>':''}</div>`;
      for(const e of live.timeline){
        const pos = e.delta>0;
        h += `<div class="mv"><span class="d ${pos?'p':'n'}">${pos?'+':''}${e.delta}</span>
          <span class="ty">${esc(e.type)}</span>
          <span class="su">${esc(e.subject)}</span>
          <span class="me">${esc(e.ts.slice(0,10))} · ${esc(e.source)}</span></div>`;
      }
      h += `</div>`;
    }
    h += `<p class="note">${esc(d.knowledgeGrowth.note)}</p></section>`;
  }

  // System Health
  h += `<section><h2>System Health</h2><div class="row conns">`;
  for(const x of d.systemHealth){
    h += `<div class="health">
      <span class="dot" style="background:${HEALTH[x.status]||'var(--line)'}"></span>
      <div><div class="name">${esc(x.name)} — ${esc(x.status)}</div><div class="notes">${esc(x.notes||'')}</div></div>
    </div>`;
  }
  h += `</div></section>`;

  // Repositories
  h += `<section><h2>Repositories</h2><div class="row repos">`;
  for(const r of d.repositories){
    h += `<div class="repo">
      <div class="mat">${esc(r.maturity)}</div>
      <div class="name">${esc(r.name)}</div>
      <div class="role">${esc(r.role)}</div>
    </div>`;
  }
  h += `</div></section>`;

  document.getElementById('app').innerHTML = h;
  document.getElementById('foot').textContent =
    `${d.capabilities.length} capabilities · ${d.connections.length} connections · ${d.repositories.length} repositories · source: capabilities.json`;
}

const STATE_COL = {ready:'var(--ready)',partial:'var(--partial)',poc:'var(--poc)',design:'var(--design)',unknown:'var(--unknown)',missing:'var(--miss)',warning:'var(--warn)',pending:'var(--dim)'};

function renderDiagnosis(d){
  const s = d.summary;
  let h = `<div class="dx"><div class="head">🩺 <b>Diagnosis</b> — why the platform is where it is</div>`;
  h += `<div class="top"><b>${s.needAttention}</b> capabilities need attention · <b>${s.unknown}</b> unknown · <b>${s.signals}</b> system signals`;
  if(s.topRoot) h += `<br/>Most blocking root: <b>${esc(s.topRoot.label)}</b> (×${s.topRoot.count}) — ${esc(s.topRoot.reason)}`;
  h += `</div>`;

  for(const f of d.findings){
    h += `<div class="finding"><div class="ttl"><span class="dot" style="background:${STATE_COL[f.state]||'var(--line)'}"></span>${esc(f.label)} <span style="color:var(--dim);font-size:12px">${esc(f.hebrew)}</span></div>`;
    for(const ch of f.chains){
      const segs = ch.steps.map((st,i)=>{
        const root = i===ch.steps.length-1 && ch.steps.length>1;
        return `<span class="seg ${root?'root':''}">${esc(st.label)}</span>`;
      }).join('<span class="arr">→</span>');
      h += `<div class="chain">${segs}</div>`;
      h += `<div class="because">because <b>${esc(ch.root.reason)}</b>${ch.root.remedy?` &nbsp;·&nbsp; fix: ${esc(ch.root.remedy)}`:''}</div>`;
    }
    h += `</div>`;
  }

  if(d.signals.length){
    h += `<div class="signals">`;
    for(const sig of d.signals){
      h += `<div class="sig" style="border-left-color:${STATE_COL[sig.state]||'var(--warn)'}">
        <div class="sn">${esc(sig.label)}</div>
        <div style="color:var(--dim);margin-top:3px">${esc(sig.reason)}</div>
        ${sig.remedy?`<div class="sf">↳ ${esc(sig.remedy)}</div>`:''}
      </div>`;
    }
    h += `</div>`;
  }

  h += `</div>`;
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>Diagnosis</h2>${h}`;
  const app = document.getElementById('app');
  app.insertBefore(sec, app.firstChild);
}

Promise.all([
  fetch('/api/capabilities').then(r => r.ok ? r.json() : Promise.reject(r.status)),
  fetch('/api/diagnosis').then(r => r.ok ? r.json() : null).catch(() => null),
  fetch('/api/knowledge').then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([reg, dx, kg]) => { window.__KG = kg; render(reg); if(dx) renderDiagnosis(dx); })
  .catch(e => { document.getElementById('boot').textContent = 'Failed to load registry: ' + e; });
</script>
</body>
</html>
